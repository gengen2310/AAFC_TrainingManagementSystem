server {
    listen __PORT__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json;

    # Railway health probe
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # No caching on the HTML — always fetch latest
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP: this is a normal Vite build (no inline <script> tags, confirmed in dist/index.html),
        # so script-src can be 'self' only — stricter than connected-frontend's single-file SPA,
        # which requires 'unsafe-inline' for its inline JS. connect-src is set to the runtime API
        # base (injected by docker-entrypoint.sh); falls back to https: (any HTTPS origin) if
        # VITE_API_BASE_URL/AAFC_API_BASE is not set in the environment. style-src/font-src allow
        # Google Fonts (Montserrat) — same allowlist connected-frontend's nginx.conf already uses.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' __CSP_CONNECT_SRC__; img-src 'self' data:; frame-ancestors 'none'" always;
    }
}
