# Render Blueprint — AAFC TMS Staging (V17.1)
#
# Services deployed from branch: deployment/staging-v17.1
#   - aafc-tms-backend-staging  (Docker web service, port 8000)
#   - aafc-tms-frontend-staging (static site, connected-frontend/)
#
# Database: Supabase PostgreSQL (free tier, provisioned separately).
#   Use the Session Pooler connection string on port 5432 — not the direct
#   endpoint, which uses IPv6 and is unreachable from Render's network.
#
# Secrets marked sync: false are entered by the operator in the Render
# dashboard and are never committed to source control.
#
# Deployment sequence:
#   1. Provision Supabase project → copy Session Pooler URI (port 5432).
#   2. New Blueprint → select this repo → branch deployment/staging-v17.1.
#   3. Render prompts for DATABASE_URL and STAGING_BOOTSTRAP_SYSADMIN_CODE.
#   4. After both services are live, note the actual URLs from Render dashboard.
#   5. Set CORS_ALLOWED_ORIGINS on the backend to the exact frontend URL.
#   6. Update <meta name="aafc-api-base"> in index.html to the exact backend URL.
#   7. Push → both services redeploy → run tests.

services:
  - type: web
    name: aafc-tms-backend-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: deployment/staging-v17.1
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: staging

      # Supabase Session Pooler URI — operator enters this in Render dashboard.
      # Format: postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres
      # Do NOT use the direct endpoint (db.[REF].supabase.co) — it uses IPv6.
      - key: DATABASE_URL
        sync: false

      # Bootstrap code for the initial system_admin account.
      # Choose a strong value (≥20 chars). Enter it in Render dashboard — never commit it.
      # After first login + code reset via System Console, remove this variable from Render.
      - key: STAGING_BOOTSTRAP_SYSADMIN_CODE
        sync: false

      # Auto-generated by Render — cryptographically random, never printed, never committed.
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true

      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax

      # Set to the exact frontend URL after both services are deployed.
      # No wildcards. No localhost. The actual URL from the Render dashboard.
      # Example: https://aafc-tms-frontend-staging.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: aafc-tms-frontend-staging
    runtime: static
    staticPublishPath: ./connected-frontend
    branch: deployment/staging-v17.1
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
