server {
    listen __PORT__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json;

    # Railway health probe
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # No caching on the HTML — always fetch latest
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP: script-src 'unsafe-inline' required — app is a single-file SPA with all JS inline.
        # connect-src is set to the runtime API base (injected by docker-entrypoint.sh); falls back
        # to https: (any HTTPS origin) if AAFC_API_BASE is not set in the environment.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' __CSP_CONNECT_SRC__; img-src 'self' data:; frame-ancestors 'none'" always;
    }
}
