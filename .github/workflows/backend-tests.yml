name: Backend Tests

on:
  push:
    branches: [main, "release/**", "fix/**", "next-stage/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  pytest:
    name: pytest (Python 3.13, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q --tb=short
        env:
          ENVIRONMENT: development
          JWT_SECRET: dev-only-change-me-jwt-secret-aafc-tms
          SECRET_KEY: dev-only-change-me-in-production-aafc

  typecheck:
    name: TypeScript typecheck (Planning Workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  build:
    name: Frontend build (Planning Workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

  release-static:
    name: Release static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch main comparison tree
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in release diff
        run: git diff --check origin/main HEAD

      - name: Verify shared design-token sync
        run: python scripts/check_token_sync.py

      - name: Verify frontend security hygiene
        shell: bash
        run: |
          set -euo pipefail

          if grep -nE "SYSADMIN2026|ADMIN703|ADMIN7WG|ADMINNATIONAL|703SQN2026|AUDITOR2026" connected-frontend/index.html; then
            echo "Seeded/demo access code found in Main TMS production frontend"
            exit 1
          fi

          if grep -nE "localStorage\.(setItem|getItem)\(['\"]+(token|jwt|role|session|user|scope|access_code|squadron|wing)" connected-frontend/index.html; then
            echo "Operational/session data found in Main TMS localStorage"
            exit 1
          fi

          if grep -nE "code_hash|plain_code|JWT_SECRET|SECRET_KEY" connected-frontend/index.html; then
            echo "Sensitive backend/auth implementation token found in Main TMS frontend"
            exit 1
          fi

          if grep -RInE --include='*.ts' --include='*.tsx' \
            "localStorage\.(setItem|getItem)\(['\"]+(token|jwt|role|session|user|scope|access_code|squadron|wing)" \
            frontend/src; then
            echo "Operational/session data found in Planning Workspace localStorage"
            exit 1
          fi

          echo "Frontend security hygiene checks passed"

      - name: Verify deploy control logic
        run: bash scripts/test_deploy_logic.sh

  migration-rehearsal:
    name: PostgreSQL migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aafc_test
          POSTGRES_PASSWORD: aafc_test
          POSTGRES_DB: aafc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install psycopg2 for PostgreSQL driver
        run: pip install psycopg2-binary

      - name: Run Alembic migrations against PostgreSQL
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://aafc_test:aafc_test@localhost:5432/aafc_test
          ENVIRONMENT: development
          JWT_SECRET: dev-only-change-me-jwt-secret-aafc-tms
          SECRET_KEY: dev-only-change-me-in-production-aafc

      - name: Seed representative data and run migration rehearsal
        working-directory: backend
        # rehearse_data_migrations.py seeds and validates data-migration paths.
        # This is important: the project has experienced migrations that passed
        # empty-DB rehearsal but failed against populated staging data.
        run: |
          if [ -f scripts/rehearse_data_migrations.py ]; then
            python scripts/rehearse_data_migrations.py
          else
            python manage.py --seed
            echo "Seed complete; no rehearse_data_migrations.py found"
          fi
        env:
          DATABASE_URL: postgresql://aafc_test:aafc_test@localhost:5432/aafc_test
          # PGUSER/PGPASSWORD/PGHOST let psql connect without -U/-h flags.
          # Without these, psql defaults to the OS user (runner/root) which has
          # no PostgreSQL role, causing the data-migration rehearsal to fail.
          PGUSER: aafc_test
          PGPASSWORD: aafc_test
          PGHOST: localhost
          ENVIRONMENT: development
          JWT_SECRET: dev-only-change-me-jwt-secret-aafc-tms
          SECRET_KEY: dev-only-change-me-in-production-aafc
