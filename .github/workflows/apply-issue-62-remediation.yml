name: Apply Issue 62 remediation patch

on:
  push:
    branches:
      - fix/issue-62-workflow-remediation

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue62/part-* > /tmp/issue-62-workflow-remediation.patch
          git apply --check /tmp/issue-62-workflow-remediation.patch
          git apply /tmp/issue-62-workflow-remediation.patch
          rm -rf .issue62 .github/workflows/apply-issue-62-remediation.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(issue-62): restore planning and cadet workflow contracts with regression tests'
          git push origin HEAD:fix/issue-62-workflow-remediation
