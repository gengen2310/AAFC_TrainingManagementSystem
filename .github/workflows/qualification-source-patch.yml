name: Qualification source patch

on:
  push:
    branches:
      - fix/final-release-qualification-20260908

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct CEA semantic danger styling and Weekly Program fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return s.replace(old, new, 1)

          # Correct the first patch: AAFC brand red remains the border visual;
          # the semantic dark red is the small-text foreground.
          p = Path('connected-frontend/index.html')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              '.cea-conflict-toggle.replace{border-color:var(--danger-text);color:var(--red);}',
              '.cea-conflict-toggle.replace{border-color:var(--red);color:var(--danger-text);}',
              'CEA replacement styling',
          )
          s = s.replace('  --red:    #e51937;\n      --danger-text:#b5122f;   /* Red — danger, errors, must-attend only */',
                        '  --red:    #e51937;   /* Red — AAFC brand/danger visual accent */\n  --danger-text:#b5122f; /* Accessible danger foreground for normal text */', 1)
          p.write_text(s, encoding='utf-8')

          # Weekly Program fixtures intentionally live far outside current terms.
          # Select All terms before requiring the exact ISO-valued night option.
          p = Path('frontend/e2e-connected/weekly-program-classes.spec.ts')
          s = p.read_text(encoding='utf-8')
          needle = '''  await expect(page.locator("#wp-sel")).toBeVisible({ timeout: 8000 });\n  await page.locator("#wp-sel").selectOption(testDate);'''
          replacement = '''  await expect(page.locator("#wp-sel")).toBeVisible({ timeout: 8000 });\n  await page.locator("#wp-f-term").selectOption("all");\n  const exactNight = page.locator(`#wp-sel option[value="${testDate}"]`);\n  await expect(exactNight).toHaveCount(1, { timeout: 8000 });\n  await page.locator("#wp-sel").selectOption({ value: testDate });'''
          n = s.count(needle)
          if n != 3:
              raise SystemExit(f'Weekly Program stale fixture pattern: expected 3, found {n}')
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify targeted patch
        run: |
          git diff --check
          grep -n -- '--danger-text\|cea-conflict-toggle.replace' connected-frontend/index.html | head -10
          grep -n 'wp-f-term.*selectOption\|exactNight' frontend/e2e-connected/weekly-program-classes.spec.ts
          git diff --stat

      - name: Commit targeted correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connected-frontend/index.html frontend/e2e-connected/weekly-program-classes.spec.ts
          git commit -m "fix(qualification): correct danger foreground and weekly fixtures"
          git push origin HEAD:${GITHUB_REF_NAME}
