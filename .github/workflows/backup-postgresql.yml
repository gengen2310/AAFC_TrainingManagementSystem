# Daily PostgreSQL backup — AAFC TMS PRODUCTION
#
# Schedule: 02:00 AWST daily (UTC+8 = 18:00 UTC).
# Also supports manual trigger via workflow_dispatch.
#
# This workflow backs up the PRODUCTION database only. For a staging-only
# manual backup, use backup-postgresql-staging.yml instead — the two use
# different secrets and cannot be confused for one another's evidence.
#
# What this workflow does:
#   1. Verifies PROD_DATABASE_BACKUP_URL is set and does not match the known
#      staging database fingerprint (defence in depth against a copy/paste
#      mistake between the two workflows/secrets).
#   2. Runs pg_dump (custom format) against a Postgres session-mode/direct
#      connection (never a port-6543 transaction pooler — see note below).
#   3. Computes SHA-256 of the plaintext dump for integrity verification.
#   4. Encrypts both the dump and checksum with the repo's GPG public key.
#   5. Uploads encrypted files as a private GitHub Actions artifact (30 days),
#      named postgresql-production-backup-<timestamp> so it can never be
#      mistaken for a staging artifact.
#   6. Deletes all plaintext files even if a step fails.
#
# Prerequisites — GitHub Secrets:
#   PROD_DATABASE_BACKUP_URL — production PostgreSQL session-mode/direct URI,
#                              port 5432, SSL required. NOT the same URL the
#                              application uses at runtime (that one is a
#                              port-6543 transaction pooler, unsuitable for
#                              pg_dump — see deployment/backup-dr.md).
#
# Prerequisites — Repo file:
#   .github/backup-public-key.asc  — ASCII-armored GPG public key.
#                                     See deployment/backup-dr.md for
#                                     key generation instructions.
#
# Credentials never appear in logs. The database URL is never stored,
# echoed, or returned — only a non-secret SHA-256 hostname fingerprint is
# ever printed, for source-verification purposes.
#
# To pin actions to commit SHAs (recommended for production hardening):
#   Replace `@v4` with `@<sha>` — see each action's releases page.
---
name: PostgreSQL Backup — Production — Daily

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 AWST (UTC+8) every day
  workflow_dispatch:         # Manual trigger — Actions tab → Run workflow

permissions:
  contents: read             # checkout only; no write access needed

concurrency:
  group: postgresql-backup-production
  cancel-in-progress: false  # never cancel a running backup

jobs:
  backup:
    name: Dump, encrypt, upload (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DUMP_PATH: ""
      CHECKSUM_PATH: ""
      ENCRYPTED_DUMP: ""
      ENCRYPTED_CHECKSUM: ""
      TIMESTAMP: ""
      # Known staging Postgres hostname fingerprint (SHA-256 of the hostname
      # only — not secret, cannot be reversed to the hostname). Used to
      # refuse running this PRODUCTION workflow against the staging database.
      FORBIDDEN_HOST_FINGERPRINT: "c47528fd4d51e55c8c09fae68ab827747c6551acb2b7197635505dda93bd5667"

    steps:
      # ── 1. Install tools ────────────────────────────────────────────────────
      # Ubuntu's default postgresql-client is version 16. Production's server
      # is currently PostgreSQL 17.x and staging's is 18.x; pg_dump refuses to
      # dump from a server *newer* than itself but happily dumps an *older*
      # one, so installing the newest supported client (18) from the official
      # PGDG apt repository covers both without needing per-target logic.
      - name: Install postgresql-client and gpg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg2 lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version
          gpg --version | head -1

      # ── 2. Checkout (sparse — only the GPG public key file) ─────────────────
      - name: Checkout public key
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/backup-public-key.asc
          sparse-checkout-cone-mode: false

      # ── 3. Validate public key file is not the placeholder ──────────────────
      - name: Validate public key file
        run: |
          if grep -q '^PLACEHOLDER' .github/backup-public-key.asc 2>/dev/null; then
            echo "::error::backup-public-key.asc contains only the placeholder."
            echo "::error::Follow deployment/backup-dr.md to generate a GPG keypair"
            echo "::error::and replace .github/backup-public-key.asc with the real public key."
            exit 1
          fi
          if ! grep -q 'BEGIN PGP PUBLIC KEY' .github/backup-public-key.asc 2>/dev/null; then
            echo "::error::backup-public-key.asc does not appear to be a PGP public key block."
            exit 1
          fi
          echo "Public key file looks valid."

      # ── 4. Import GPG public key ─────────────────────────────────────────────
      - name: Import GPG public key
        run: |
          gpg --import --batch .github/backup-public-key.asc
          # Confirm at least one key was imported
          gpg --list-keys 2>/dev/null | grep -c 'pub' | grep -v '^0$' > /dev/null \
            || { echo '::error::GPG public key import failed — no keys found after import'; exit 1; }
          echo "GPG public key imported successfully."
          # Show key fingerprint only (not sensitive)
          gpg --list-keys --fingerprint 2>/dev/null | grep -A1 'pub' | grep 'Key fingerprint' || \
            gpg --list-keys 2>/dev/null | grep 'uid' | sed 's/.*uid.*\[/[/'

      # ── 5. Source preflight — verify secret is set and is NOT staging ───────
      - name: Verify production source
        env:
          PROD_DATABASE_BACKUP_URL: ${{ secrets.PROD_DATABASE_BACKUP_URL }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, hashlib, urllib.parse

          url = os.environ.get('PROD_DATABASE_BACKUP_URL', '')
          if not url:
              print('::error::PROD_DATABASE_BACKUP_URL secret is not set', flush=True)
              sys.exit(1)

          p = urllib.parse.urlparse(url)
          hostname = p.hostname or ''
          port = p.port or 5432
          fp = hashlib.sha256(hostname.encode()).hexdigest()
          forbidden = os.environ.get('FORBIDDEN_HOST_FINGERPRINT', '')

          print(f'source label: production')
          print(f'host fingerprint (sha256, non-reversible): {fp}')
          print(f'port: {port}')

          if fp == forbidden:
              print('::error::PROD_DATABASE_BACKUP_URL host fingerprint matches the KNOWN STAGING database.', flush=True)
              print('::error::Refusing to run — this workflow must only ever target production.', flush=True)
              sys.exit(1)

          if port == 6543:
              print('::error::Port 6543 is a Supabase transaction pooler — unsuitable for pg_dump.', flush=True)
              print('::error::Use the session pooler (port 5432) or a direct connection instead.', flush=True)
              sys.exit(1)

          print('Source verification passed.')
          PYEOF

      # ── 6. Dump database ─────────────────────────────────────────────────────
      - name: Dump database
        env:
          PROD_DATABASE_BACKUP_URL: ${{ secrets.PROD_DATABASE_BACKUP_URL }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          DUMP_PATH="/tmp/aafc_dump_production_${TIMESTAMP}.dump"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "DUMP_PATH=${DUMP_PATH}" >> "$GITHUB_ENV"

          # Parse URL with Python — never echo the URL, never pass password on CLI
          cat > /tmp/_dump_helper.py << 'PYEOF'
          import os, sys, subprocess, urllib.parse

          dump_path = sys.argv[1]
          url = os.environ.get('PROD_DATABASE_BACKUP_URL', '')
          if not url:
              print('::error::PROD_DATABASE_BACKUP_URL secret is not set', flush=True)
              sys.exit(1)

          p = urllib.parse.urlparse(url)
          password = urllib.parse.unquote(p.password or '')
          hostname = p.hostname or ''
          port     = str(p.port or 5432)
          username = p.username or 'postgres'
          dbname   = (p.path or '/postgres').lstrip('/') or 'postgres'
          qs       = dict(urllib.parse.parse_qsl(p.query))
          sslmode  = qs.get('sslmode', 'require')  # Supabase requires TLS

          env = {k: v for k, v in os.environ.items()}
          env['PGPASSWORD'] = password
          env['PGSSLMODE']  = sslmode
          env.pop('PROD_DATABASE_BACKUP_URL', None)   # do not pass URL into subprocess

          cmd = [
              'pg_dump',
              '--format=custom',
              '--no-owner',
              '--no-privileges',
              '--no-password',
              # Supabase projects also provision auth/storage/realtime/vault/
              # graphql/pgbouncer schemas alongside the app's own `public`
              # schema. Those are Supabase-platform-managed, not application
              # data, and some (e.g. vault's supabase_vault extension) don't
              # exist on a disposable vanilla Postgres restore target at all
              # — a prior restore-test run failed on exactly that. The AAFC
              # TMS application only ever uses the `public` schema (no model
              # declares otherwise), so that's the only schema worth backing
              # up or restoring for disaster recovery purposes.
              '--schema=public',
              '--host',     hostname,
              '--port',     port,
              '--username', username,
              '--dbname',   dbname,
              '--file',     dump_path,
          ]

          result = subprocess.run(cmd, env=env, capture_output=True)
          if result.returncode != 0:
              stderr = result.stderr.decode('utf-8', errors='replace')
              # Sanitise: never print lines that could contain credentials
              safe_lines = [
                  l for l in stderr.splitlines()
                  if not any(kw in l.lower()
                             for kw in ['password', 'supabase', 'connection string',
                                        hostname.lower()])
              ]
              for line in safe_lines:
                  print(line, file=sys.stderr, flush=True)
              print(f'::error::pg_dump failed with exit code {result.returncode}',
                    flush=True)
              sys.exit(1)

          size = os.path.getsize(dump_path)
          if size == 0:
              print('::error::pg_dump produced an empty file', flush=True)
              sys.exit(1)

          print(f'Dump complete: {size:,} bytes')
          PYEOF

          python3 /tmp/_dump_helper.py "$DUMP_PATH"

      # ── 7. Compute SHA-256 integrity checksum ───────────────────────────────
      - name: Compute checksum
        run: |
          CHECKSUM_PATH="/tmp/aafc_dump_production_${TIMESTAMP}.sha256"
          echo "CHECKSUM_PATH=${CHECKSUM_PATH}" >> "$GITHUB_ENV"
          sha256sum "$DUMP_PATH" > "$CHECKSUM_PATH"
          echo "Checksum: $(cat "$CHECKSUM_PATH")"

      # ── 8. Encrypt dump and checksum ────────────────────────────────────────
      - name: Encrypt backup
        run: |
          ENCRYPTED_DUMP="/tmp/aafc_tms_backup_production_${TIMESTAMP}.dump.gpg"
          ENCRYPTED_CHECKSUM="/tmp/aafc_tms_backup_production_${TIMESTAMP}.sha256.gpg"
          echo "ENCRYPTED_DUMP=${ENCRYPTED_DUMP}" >> "$GITHUB_ENV"
          echo "ENCRYPTED_CHECKSUM=${ENCRYPTED_CHECKSUM}" >> "$GITHUB_ENV"

          # Encrypt dump
          gpg \
            --trust-model always \
            --encrypt \
            --recipient-file .github/backup-public-key.asc \
            --output "$ENCRYPTED_DUMP" \
            "$DUMP_PATH"

          # Encrypt checksum
          gpg \
            --trust-model always \
            --encrypt \
            --recipient-file .github/backup-public-key.asc \
            --output "$ENCRYPTED_CHECKSUM" \
            "$CHECKSUM_PATH"

          echo "Encrypted dump size:     $(stat -c%s "$ENCRYPTED_DUMP") bytes"
          echo "Encrypted checksum size: $(stat -c%s "$ENCRYPTED_CHECKSUM") bytes"

      # ── 9. Validate GPG packet integrity (no decryption) ────────────────────
      - name: Validate encrypted files
        run: |
          for f in "$ENCRYPTED_DUMP" "$ENCRYPTED_CHECKSUM"; do
            if [ ! -s "$f" ]; then
              echo "::error::Encrypted file is empty: $f"; exit 1
            fi
            # --list-packets works without the private key
            gpg --batch --list-packets "$f" 2>&1 \
              | grep -qi 'encrypted\|session key\|public.key.encrypted' \
              || { echo "::error::File does not contain GPG encrypted packets: $f"; exit 1; }
          done
          echo "Both encrypted files validated."

      # ── 10. Stage and upload artifact ────────────────────────────────────────
      - name: Stage artifact files
        run: |
          mkdir -p /tmp/backup_artifact
          cp "$ENCRYPTED_DUMP"     /tmp/backup_artifact/
          cp "$ENCRYPTED_CHECKSUM" /tmp/backup_artifact/
          ls -lh /tmp/backup_artifact/

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-production-backup-${{ env.TIMESTAMP }}
          path: /tmp/backup_artifact/
          retention-days: 30
          if-no-files-found: error

      # ── 11. Clean up plaintext files (always, even on failure) ──────────────
      - name: Clean up plaintext files
        if: always()
        run: |
          rm -f "$DUMP_PATH" "$CHECKSUM_PATH" /tmp/_dump_helper.py 2>/dev/null || true
          echo "Plaintext dump and checksum removed."

  # ── 12. Alert on failure (optional Slack webhook) ──────────────────────────
  # If SLACK_BACKUP_ALERT_WEBHOOK is set in repo/environment Secrets, a brief
  # alert is posted to the configured channel on any backup failure. The
  # message contains only the workflow name, run ID (linkable), and timestamp —
  # no credentials or database details are included.
  # If the secret is not set, this job succeeds silently (GitHub Actions still
  # sends its default failure email to the repository owner).
  #
  # To configure:
  #   1. Create an incoming-webhook integration in your Slack workspace.
  #   2. Store the webhook URL in Settings → Secrets → Actions as
  #      SLACK_BACKUP_ALERT_WEBHOOK (repo or environment level).
  notify-on-failure:
    name: Alert on backup failure
    runs-on: ubuntu-24.04
    needs: [backup]
    if: ${{ failure() }}
    steps:
      - name: Post Slack alert
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BACKUP_ALERT_WEBHOOK }}
          # Pass GitHub context via env vars rather than inline ${{ }} in run:
          # — defence-in-depth best practice even for non-user-controlled values.
          # github.run_id is always numeric; github.repository is owner/name.
          # Both are already available as $GITHUB_RUN_ID / $GITHUB_REPOSITORY
          # by default, but explicit env: makes the intent and source clear.
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_BACKUP_ALERT_WEBHOOK is not configured — skipping Slack alert."
            echo "GitHub Actions default failure email has been sent."
            exit 0
          fi
          RUN_URL="https://github.com/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"
          PAYLOAD=$(printf '{"text":"🚨 *AAFC TMS — Production backup FAILED*\nRun: <%s|%s>\nTime: %s UTC\nCheck the run log and restore capability immediately."}' \
            "$RUN_URL" "$GH_RUN_ID" "$(date -u '+%Y-%m-%d %H:%M')")
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK"
          echo "Slack alert sent."
