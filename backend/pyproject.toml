[project]
name = "aafc-tms-national"
version = "9.0.0"
description = "AAFC Training Management System — National Deployable Edition (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "pyjwt>=2.8",
  "passlib>=1.7",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
  "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "black>=24.0", "pytest-cov>=7.0"]
prod = ["psycopg2-binary>=2.9", "redis>=5.0", "celery>=5.3", "gunicorn>=21.2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
